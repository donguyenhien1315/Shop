services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      APP_PIN: ${APP_PIN:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-before-public-deploy}
      DATABASE_URL: postgres://cantin:cantin@db:5432/cantin
      PGSSLMODE: disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cantin
      POSTGRES_PASSWORD: cantin
      POSTGRES_DB: cantin
    volumes:
      - cantin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cantin -d cantin"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  cantin_pgdata:
